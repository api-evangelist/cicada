aid: cicada
name: Cicada
description: Cicada Securities, LLC is a financial technology company revolutionizing
  the bond markets in Emerging Markets. It operates an Alternative Trading System (ATS)
  focused on local-currency-denominated government bonds in Mexico (M Bonos, UDI Bonos,
  and Cetes), enhancing liquidity and facilitating all-to-all access in an anonymous
  trading environment through central limit orderbook and request-for-quote protocols.
  Cicada Securities, LLC is an SEC-registered broker-dealer and FINRA member, and Cicada
  SEF, LLC is an applicant for swap execution facility registration with the CFTC.
  The company offers a trading platform, live pricing data, and a programmatic API
  for direct access to LatAm local-currency rates market liquidity, backed by 500 Global.
